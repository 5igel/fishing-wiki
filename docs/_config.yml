title: Рибальська вікі
description: Персональна вікі про рибалку — ловиська, спорядження, техніка, улови
lang: uk

# Тема для вікі: ліва бічна навігація по всіх сторінках + пошук по сайту.
# (remote_theme працює на GitHub Pages через штатний плагін jekyll-remote-theme)
remote_theme: just-the-docs/just-the-docs

# Пошук по сайту (з коробки в just-the-docs)
search_enabled: true

# Клікабельні якорі біля заголовків
heading_anchors: true

# GitHub Pages сам вмикає: jekyll-optional-front-matter (рендерить .md без front-matter),
# jekyll-relative-links (.md-лінки → .html), jekyll-titles-from-headings (заголовок з першого # H1).
# Порядок і структура сайдбара — у блоці defaults нижче (без front-matter у сторінках).

# Ліве меню (just-the-docs): лише основні розділи; окремі сторінки — згорнуті підпункти хабів.
# Задається через defaults за шляхом файлу, щоб сторінки лишались без front-matter.
# Нова сторінка gear-rod-*/gear-reel-*/gear-float-*/gear-line-*/waters-* → додати її сюди як child.
defaults:
  - scope: { path: "index.md" }
    values: { title: "Головна", nav_order: 1 }
  - scope: { path: "waters.md" }
    values: { title: "Водойми", nav_order: 2, has_children: true }
  - scope: { path: "gear-rods.md" }
    values: { title: "Вудки та котушки", nav_order: 3, has_children: true }
